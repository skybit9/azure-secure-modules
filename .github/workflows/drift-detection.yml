name: drift-detection

on:
  schedule:
    - cron: "0 12 * * 1"     # Monday 08:00 America/Toronto during EDT
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    if: vars.AZURE_ENABLED == 'true'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: init
        working-directory: environments/dev
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=dev/network.tfstate"

      - name: plan detailed exitcode
        id: drift
        working-directory: environments/dev
        env:
          ARM_USE_OIDC: "true"
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true
        run: terraform plan -detailed-exitcode -input=false -no-color -out=drift.tfplan

      - name: open drift issue
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Infrastructure drift detected in dev on ${new Date().toISOString().slice(0,10)}`,
              body: 'Scheduled terraform plan returned changes. Review the workflow run and reconcile.',
              labels: ['drift', 'infrastructure']
            })
