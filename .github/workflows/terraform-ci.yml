name: terraform-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # OIDC federation to Entra ID
  pull-requests: write
  security-events: write

env:
  TF_VERSION: "1.15.8"

jobs:
  # ---------------------------------------------------------------------------
  # Repository wide static checks. No credentials, no cloud.
  # ---------------------------------------------------------------------------
  lint:
    name: fmt and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact

  # ---------------------------------------------------------------------------
  # Per module validate, test and example plan. Matrix keeps modules independent,
  # so a broken module fails on its own line instead of hiding in one big job.
  # ---------------------------------------------------------------------------
  module:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - azure-network
          - azure-observability
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: validate module
        working-directory: modules/${{ matrix.module }}
        run: |
          terraform init -backend=false
          terraform validate

      # mock_provider means the full apply path runs with no Azure tenant.
      - name: terraform test
        working-directory: modules/${{ matrix.module }}
        run: terraform test

      # Every example must at least initialise and validate, so docs cannot rot.
      - name: validate examples
        working-directory: modules/${{ matrix.module }}
        run: |
          for dir in examples/*/; do
            echo "::group::validate ${dir}"
            terraform -chdir="${dir}" init -backend=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Security scanning across the whole repository.
  # ---------------------------------------------------------------------------
  scan:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Rego unit tests. Policies are code, so they get their own tests.
  # ---------------------------------------------------------------------------
  policy-test:
    name: policy unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: opa test
        run: opa test policies -v

  # ---------------------------------------------------------------------------
  # Real plan against Azure, gated by the policy bundle. Requires secrets.
  # Skipped automatically when AZURE_CLIENT_ID is not configured, so the repo
  # stays green before a subscription exists.
  # ---------------------------------------------------------------------------
  plan:
    name: plan and policy gate
    runs-on: ubuntu-latest
    needs: [lint, module, scan, policy-test]
    if: vars.AZURE_ENABLED == 'true'
    environment: dev
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=dev/network.tfstate"

      - name: terraform plan
        env:
          ARM_USE_OIDC: "true"
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > tfplan.json

      - name: Conftest policy gate
        uses: instrumenta/conftest-action@master
        with:
          files: environments/dev/tfplan.json
          policy: policies

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: environments/dev/tfplan
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Apply. Main branch only, behind a protected environment approval.
  # ---------------------------------------------------------------------------
  apply:
    name: apply dev
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AZURE_ENABLED == 'true'
    environment: dev-apply
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=dev/network.tfstate"

      - name: terraform apply
        env:
          ARM_USE_OIDC: "true"
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform apply -auto-approve -input=false
